<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AURELIA CMS — Luxury Blog Engine</title>

   <style>

/* =======================================================
   AURELIA CMS
   SINGLE FILE ENGINE
   ======================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#07070b;
    color:white;
    overflow:hidden;
}

/* ===== BACKGROUND ===== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#6f00ff55,transparent 30%),
    radial-gradient(circle at bottom right,#00ffff22,transparent 30%),
    linear-gradient(180deg,#090909,#050505);
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    backdrop-filter:blur(80px);
    z-index:-1;
}

/* ===== LAYOUT ===== */

.engine{
    display:flex;
    height:100vh;
}

/* ===== SIDEBAR ===== */

.sidebar{
    width:330px;
    background:rgba(255,255,255,0.04);
    border-right:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(25px);
    overflow:auto;
    padding:25px;
}

.logo{
    font-size:34px;
    font-weight:900;
    background:linear-gradient(90deg,#ffffff,#9d6cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:5px;
}

.sub{
    opacity:0.6;
    margin-bottom:25px;
}

.section{
    margin-bottom:30px;
}

.section h2{
    font-size:14px;
    opacity:0.6;
    margin-bottom:12px;
    letter-spacing:2px;
}

.btn{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#6f00ff,#ae00ff);
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

.btn:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 10px 30px #6f00ff66;
}

.btn.secondary{
    background:rgba(255,255,255,0.08);
}

.btn.red{
    background:linear-gradient(135deg,#ff0040,#ff0080);
}

input, textarea, select{
    width:100%;
    padding:12px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.08);
    color:white;
    margin-bottom:10px;
    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

/* ===== CANVAS ===== */

.canvas{
    flex:1;
    overflow:auto;
    position:relative;
    padding:50px;
}

/* ===== WEBSITE PREVIEW ===== */

.website{
    max-width:1100px;
    margin:auto;
    min-height:100%;
    background:white;
    color:black;
    border-radius:35px;
    overflow:hidden;
    box-shadow:
    0 0 0 1px rgba(255,255,255,0.05),
    0 40px 120px rgba(0,0,0,0.6);
}

.hero{
    padding:100px 50px;
    background:
    linear-gradient(135deg,#1e0038,#5d00ff);
    color:white;
    text-align:center;
}

.hero h1{
    font-size:60px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    opacity:0.8;
}

.content{
    padding:40px;
}

/* ===== BLOCKS ===== */

.block{
    margin-bottom:35px;
    position:relative;
    border-radius:20px;
    overflow:hidden;
    transition:0.3s;
}

.block:hover{
    transform:translateY(-2px);
}

.block-tools{
    position:absolute;
    top:10px;
    right:10px;
    z-index:10;
    display:flex;
    gap:8px;
}

.tool-btn{
    border:none;
    width:35px;
    height:35px;
    border-radius:12px;
    cursor:pointer;
    background:rgba(0,0,0,0.7);
    color:white;
    font-weight:700;
}

.text-block{
    background:#f5f5f5;
    padding:30px;
}

.text-block h2{
    font-size:34px;
    margin-bottom:15px;
}

.text-block p{
    line-height:1.8;
    font-size:18px;
}

.image-block img{
    width:100%;
    display:block;
}

.video-block video{
    width:100%;
    display:block;
}

.columns{
    display:grid;
    gap:20px;
}

.columns.two{
    grid-template-columns:1fr 1fr;
}

.columns.three{
    grid-template-columns:1fr 1fr 1fr;
}

/* ===== FOOTER ===== */

.footer{
    padding:50px;
    background:#111;
    color:white;
    text-align:center;
}

/* ===== SAVE STATUS ===== */

.status{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#111;
    padding:14px 20px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
    z-index:999;
}

/* ===== SCROLLBAR ===== */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{
    background:#6f00ff;
    border-radius:20px;
}

</style>
</head>
<body>

<div class="engine">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">AURELIA</div>
        <div class="sub">Luxury Blog Engine</div>

        <div class="section">
           <a href="https://purplemurasaki38.github.io/Wikipedia-Sacra-Communitas-By-LUCENO/"><button>Abrir Wiki dos Santos</button></a>


            <h2>TEXTOS</h2>

            <button class="btn" onclick="addTextBlock()">
                + Adicionar Texto
            </button>

            <button class="btn secondary" onclick="add2Columns()">
                + 2 Colunas
            </button>

            <button class="btn secondary" onclick="add3Columns()">
                + 3 Colunas
            </button>

        </div>

        <div class="section">

            <h2>MÍDIA</h2>

            <button class="btn" onclick="triggerImageUpload()">
                + Imagem
            </button>

            <button class="btn" onclick="triggerVideoUpload()">
                + Vídeo
            </button>

        </div>

        <div class="section">

            <h2>PROJETO</h2>

            <button class="btn" onclick="saveEngineProject()">
                Salvar Projeto Engine
            </button>

            <button class="btn secondary" onclick="loadEngineProject()">
                Carregar Projeto Engine
            </button>

            <button class="btn" onclick="exportWebsite()">
                Exportar Site Completo
            </button>

            <button class="btn secondary" onclick="loadWebsiteHTML()">
                Carregar Site Exportado
            </button>

        </div>

        <div class="section">

            <h2>TEMA</h2>

            <select onchange="changeTheme(this.value)">
                <option value="purple">Cyber Luxury</option>
                <option value="blue">Neo Ocean</option>
                <option value="red">Inferno Crimson</option>
                <option value="white">White Corporation</option>
            </select>

        </div>

    </div>

    <!-- CANVAS -->

    <div class="canvas">

        <div class="website" id="website">

            <div class="hero" id="hero">

                <h1 contenteditable="true">
                    Meu Blog Luxuoso
                </h1>

                <p contenteditable="true">
                    Criado com AURELIA CMS
                </p>

            </div>

            <div class="content" id="content">

            </div>

            <div class="footer">
                Powered by AURELIA CMS
            </div>

        </div>

    </div>

</div>

<div class="status" id="status">
    Engine pronta.
</div>

<!-- HIDDEN INPUTS -->

<input type="file" id="imageInput" accept="image/*" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>
<input type="file" id="loadInput" hidden>

<script>

/* =======================================================
   AURELIA CMS
   ======================================================= */

const content = document.getElementById("content");
const statusBox = document.getElementById("status");

/* ===== STATUS ===== */

function setStatus(text){
    statusBox.innerText = text;
}

/* ===== TEXT BLOCK ===== */

function addTextBlock(){

    const block = document.createElement("div");

    block.className = "block text-block";

    block.innerHTML = `
        <div class="block-tools">
            <button class="tool-btn" onclick="this.parentElement.parentElement.remove()">X</button>
        </div>

        <h2 contenteditable="true">
            Novo Título
        </h2>

        <p contenteditable="true">
            Digite seu texto luxuoso aqui...
        </p>
    `;

    content.appendChild(block);

    setStatus("Texto adicionado.");
}

/* ===== IMAGE BLOCK ===== */

function triggerImageUpload(){
    document.getElementById("imageInput").click();
}

document.getElementById("imageInput").addEventListener("change",function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        const block = document.createElement("div");

        block.className = "block image-block";

        block.innerHTML = `
            <div class="block-tools">
                <button class="tool-btn" onclick="this.parentElement.parentElement.remove()">X</button>
            </div>

            <img src="${event.target.result}">
        `;

        content.appendChild(block);

        setStatus("Imagem adicionada.");
    };

    reader.readAsDataURL(file);
});

/* ===== VIDEO BLOCK ===== */

function triggerVideoUpload(){
    document.getElementById("videoInput").click();
}

document.getElementById("videoInput").addEventListener("change",function(e){

    const file = e.target.files[0];

    if(!file) return;

    const url = URL.createObjectURL(file);

    const block = document.createElement("div");

    block.className = "block video-block";

    block.innerHTML = `
        <div class="block-tools">
            <button class="tool-btn" onclick="this.parentElement.parentElement.remove()">X</button>
        </div>

        <video controls>
            <source src="${url}">
        </video>
    `;

    content.appendChild(block);

    setStatus("Vídeo adicionado.");
});

/* ===== 2 COLUMNS ===== */

function add2Columns(){

    const block = document.createElement("div");

    block.className = "block columns two";

    block.innerHTML = `
        <div class="text-block">
            <h2 contenteditable="true">Coluna 1</h2>
            <p contenteditable="true">Texto...</p>
        </div>

        <div class="text-block">
            <h2 contenteditable="true">Coluna 2</h2>
            <p contenteditable="true">Texto...</p>
        </div>
    `;

    content.appendChild(block);

    setStatus("Layout 2 colunas criado.");
}

/* ===== 3 COLUMNS ===== */

function add3Columns(){

    const block = document.createElement("div");

    block.className = "block columns three";

    block.innerHTML = `
        <div class="text-block">
            <h2 contenteditable="true">1</h2>
            <p contenteditable="true">Texto...</p>
        </div>

        <div class="text-block">
            <h2 contenteditable="true">2</h2>
            <p contenteditable="true">Texto...</p>
        </div>

        <div class="text-block">
            <h2 contenteditable="true">3</h2>
            <p contenteditable="true">Texto...</p>
        </div>
    `;

    content.appendChild(block);

    setStatus("Layout 3 colunas criado.");
}

/* ===== SAVE ENGINE ===== */

function saveEngineProject(){

    const data = {
        html: document.getElementById("website").innerHTML
    };

    const blob = new Blob(
        [JSON.stringify(data)],
        {type:"application/json"}
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "project.aurelia";

    a.click();

    setStatus("Projeto salvo.");
}

/* ===== LOAD ENGINE ===== */

function loadEngineProject(){

    const input = document.getElementById("loadInput");

    input.accept = ".aurelia,.json";

    input.onchange = function(e){

        const file = e.target.files[0];

        const reader = new FileReader();

        reader.onload = function(event){

            const data = JSON.parse(event.target.result);

            document.getElementById("website").innerHTML = data.html;

            setStatus("Projeto carregado.");
        };

        reader.readAsText(file);
    };

    input.click();
}

/* ===== EXPORT WEBSITE ===== */

function exportWebsite(){

    const html = `
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Site</title>

<style>
body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}

.hero{
padding:80px;
text-align:center;
background:linear-gradient(135deg,#6f00ff,#2a0066);
}

.content{
padding:40px;
max-width:1000px;
margin:auto;
}

.text-block{
background:#fff;
color:#000;
padding:30px;
border-radius:20px;
margin-bottom:30px;
}

img,video{
width:100%;
border-radius:20px;
margin-bottom:30px;
}

.columns{
display:grid;
gap:20px;
margin-bottom:30px;
}

.two{
grid-template-columns:1fr 1fr;
}

.three{
grid-template-columns:1fr 1fr 1fr;
}
</style>

</head>
<body>

${document.getElementById("website").innerHTML}

</body>
</html>
`;

    const blob = new Blob(
        [html],
        {type:"text/html"}
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "index.html";

    a.click();

    setStatus("Site exportado.");
}

/* ===== LOAD WEBSITE ===== */

function loadWebsiteHTML(){

    const input = document.getElementById("loadInput");

    input.accept = ".html";

    input.onchange = function(e){

        const file = e.target.files[0];

        const reader = new FileReader();

        reader.onload = function(event){

            const parser = new DOMParser();

            const doc = parser.parseFromString(
                event.target.result,
                "text/html"
            );

            const loadedWebsite = doc.body.innerHTML;

            document.getElementById("website").innerHTML = loadedWebsite;

            setStatus("Site importado.");
        };

        reader.readAsText(file);
    };

    input.click();
}

/* ===== THEMES ===== */

function changeTheme(theme){

    const hero = document.getElementById("hero");

    if(theme === "purple"){
        hero.style.background =
        "linear-gradient(135deg,#1e0038,#6f00ff)";
    }

    if(theme === "blue"){
        hero.style.background =
        "linear-gradient(135deg,#001f4d,#009dff)";
    }

    if(theme === "red"){
        hero.style.background =
        "linear-gradient(135deg,#2b0000,#ff0040)";
    }

    if(theme === "white"){
        hero.style.background =
        "linear-gradient(135deg,#d9d9d9,#ffffff)";
        hero.style.color = "#000";
    }

    setStatus("Tema alterado.");
}

/* ===== AUTO SAVE ===== */

setInterval(()=>{

    localStorage.setItem(
        "aurelia-autosave",
        document.getElementById("website").innerHTML
    );

},5000);

/* ===== LOAD AUTOSAVE ===== */

window.onload = ()=>{

    const save = localStorage.getItem(
        "aurelia-autosave"
    );

    if(save){

        document.getElementById("website").innerHTML = save;

        setStatus("Auto save restaurado.");
    }
};

</script>

</body>
</html>
